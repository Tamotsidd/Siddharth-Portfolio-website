<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selected Work</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="gallery.css">
</head>
<body id="work-gallery">
  <header>
    <nav>
      <div class="logo">S<span>·</span>T</div>
      <div class="navlinks" id="navlinks">
        <a href="index.html#home">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#work">Work</a>
        <a href="index.html#gear">Gear</a>
        <a href="index.html#contact">Contact</a>
      </div>
      <button class="navtoggle" id="navtoggle" aria-label="Toggle menu">
        <span></span><span></span>
      </button>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
          <span class="theme-icon" aria-hidden="true">◐</span>
          <span class="theme-label">Dark</span>
        </button>
        <a class="book-call" href="index.html#contact">Book a call</a>
      </div>
    </nav>
  </header>

  <main class="gallery-page wrap">
    <section class="gallery-hero">
      <p class="eyebrow">Selected Work</p>
      <h1 id="galleryTitle">Wedding Stories</h1>
      <p id="galleryDescription">A closer look at the frames I love.</p>
      <a class="back-link" href="index.html#work">← Back to portfolio</a>
    </section>

    <section class="gallery-grid-wrap">
      <div id="galleryGrid" class="gallery-grid"></div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close image">×</button>
    <button class="lightbox-arrow lightbox-prev" id="lightboxPrev" type="button" aria-label="Previous image">←</button>
    <figure class="lightbox-figure">
      <img id="lightboxImage" src="" alt="">
      <figcaption id="lightboxCaption"></figcaption>
    </figure>
    <button class="lightbox-arrow lightbox-next" id="lightboxNext" type="button" aria-label="Next image">→</button>
  </div>

  <script src="script.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
